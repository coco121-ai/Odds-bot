name: Odds Bot

on:
  schedule:
    - cron: "*/10 * * * *"     # κάθε 10 λεπτά
  workflow_dispatch:            # κουμπί "Run workflow" για χειροκίνητη εκκίνηση
    inputs:
      mode:
        description: "Τι να τρέξει"
        type: choice
        default: run
        options: [run, test-telegram, quota, leagues, markets, debug, dry-run]

permissions:
  contents: write

concurrency:
  group: odds-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode || 'run' }}"
          case "$MODE" in
            test-telegram) python bot.py --test-telegram ;;
            quota)         python bot.py --quota ;;
            leagues)       python bot.py --leagues ;;
            markets)       python bot.py --markets ;;
            debug)         python bot.py --debug ;;
            dry-run)       python bot.py --dry-run ;;
            *)             python bot.py ;;
          esac

      - name: Save state
        if: always()
        run: |
          [ -f state.json ] || exit 0
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "update state [skip ci]"
          git pull --rebase -X ours || true
          git push
