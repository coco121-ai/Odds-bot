name: Odds Bot

on:
  schedule:
    - cron: "*/10 * * * *"     # κάθε 10 λεπτά
  workflow_dispatch:            # κουμπί "Run workflow" για χειροκίνητη εκκίνηση
    inputs:
      mode:
        description: "Τι να τρέξει"
        type: choice
        default: run
        options: [run, test-telegram, stats-test, quota, leagues, markets, debug, dry-run]

permissions:
  contents: write

concurrency:
  group: odds-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode || 'run' }}"
          case "$MODE" in
            test-telegram) python bot.py --test-telegram ;;
            stats-test)    python bot.py --stats-test ;;
            quota)         python bot.py --quota ;;
            leagues)       python bot.py --leagues ;;
            markets)       python bot.py --markets ;;
            debug)         python bot.py --debug ;;
            dry-run)       python bot.py --dry-run ;;
            *)             python bot.py ;;
          esac

      - name: Save state
        if: always()
        run: |
          [ -f state.json ] || exit 0
          python -c "import json; json.load(open('state.json'))" || { echo "::warning::state.json χαλασμένο, δεν αποθηκεύτηκε"; exit 0; }
          cp state.json "$RUNNER_TEMP/state.json"
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          # Το νέο state κερδίζει πάντα· αν το push αποτύχει (π.χ. ανέβασες αρχεία την ίδια ώρα), ξαναδοκιμάζει.
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/state.json" state.json
            git add state.json
            git diff --cached --quiet && exit 0
            git commit -q -m "update state [skip ci]"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 4))
          done
          echo "::warning::Δεν αποθηκεύτηκε το state σε αυτόν τον γύρο (θα αποθηκευτεί στον επόμενο)"
